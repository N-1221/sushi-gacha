<title>回転寿司ガチャ</title>

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
    background-color: #c89b6d;
    text-align: center;
    padding: 15px;
    transition: 0.5s;
}
h1 { color: #0078d7; }

/* 予算設定エリアのスタイル */
.budget-box {
    margin: 15px auto;
    background: rgba(255,255,255,0.85);
    width: fit-content;
    padding: 15px 25px;
    border-radius: 10px;
    border: 2px solid #8b5a2b;
}
.budget-box label {
    font-weight: bold;
    font-size: 18px;
    display: block;
    margin-bottom: 8px;
}
.budget-slider {
    width: 250px;
    margin: 5px 0;
}
#budgetText {
    color: #d32f2f;
    font-size: 20px;
}

button {
    padding: 12px 24px;
    font-size: 18px;
    background: #0078d7;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 8px;
    width: 90%;
    max-width: 320px;
}
button:hover { background: #005fa3; }

#result {
    margin-top: 30px;
    background: rgba(255,255,255,0.9);
    padding: 20px;
    border-radius: 10px;
    width: 95%;
    max-width: 700px;
    box-sizing: border-box;
    margin: auto;
    border: 3px solid #8b5a2b;
}

/* 左：名前 / 右：値段 */
#list li {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed #ccc;
    padding: 6px 0;
}

.name {
    text-align: left;
    word-break: break-word;
    width: 70%;
}

.price {
    text-align: right;
    min-width: 140px;
    font-weight: bold;
}

/* ✨ キラーン */
@keyframes shine {
    0% { transform: translate(2px, 2px) rotate(0deg); }
    25% { transform: translate(-2px, 2px) rotate(-1deg); }
    50% { transform: translate(2px, -2px) rotate(1deg); }
    75% { transform: translate(-2px, -2px) rotate(0deg); }
    100% { transform: translate(2px, 2px) rotate(1deg); }
}

.shine {
    animation: shine 0.4s ease;
}

.allergy-box {
    margin: 20px auto;
    background: rgba(255,255,255,0.85);
    width: fit-content;
    padding: 15px 25px;
    border-radius: 10px;
    border: 2px solid #8b5a2b;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.allergy-box h3 {
    width: 100%;
    margin: 0 0 10px 0;
}
    
.allergy-box label {
    font-weight: bold;
}

@media screen and (max-width: 600px) {
    h1 { font-size: 26px; }
    button { font-size: 20px; padding: 14px; }
    #list li { font-size: 14px; gap: 10px; }
    .price { min-width: 90px; font-size: 13px; }
}
</style>
</head>

function updateBudget(val) {
    currentBudget = parseInt(val);
    document.getElementById("budgetText").textContent = currentBudget.toLocaleString();
}

function isAllergyItem(name, allergies) {
    if (allergies.includes("そば") && (name.includes("そば") || name.includes("スマイル"))) return true;

    if (allergies.includes("魚卵") && (
        name.includes("いくら") || name.includes("イクラ") || name.includes("つぶっこ") ||
        name.includes("たら") || name.includes("カリフォルニアロール")
    )) return true;

    if (allergies.includes("軍艦") && name.includes("軍艦")) return true;
    if (allergies.includes("巻き") && name.includes("巻")) return true;

    if (allergies.includes("アルコール") && (
        name.includes("アルコール") || name.includes("ビール") || name.includes("サワー") ||
        name.includes("焼酎") || name.includes("金勝山") || name.includes("ハイボール")
    )) return true;

    if (allergies.includes("追加トッピング") && name.includes("追加トッピング")) return true;
    if (allergies.includes("高価皿") && ginzaraNames.includes(name)) return true;

    return false;
}
    
function gacha() {
    if (isRolling) return;
    isRolling = true;
    
    document.body.style.backgroundImage = woodBg;
    document.body.style.backgroundColor = woodColor;

    const oldTitle = document.getElementById("godTitle");
    if (oldTitle) oldTitle.remove();

    document.getElementById("spin").play();

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "<h2>注文中...</h2>";

    const allergies = [...document.querySelectorAll(".allergy:checked")].map(el => el.value);

    let items;

    if (Math.random() < 0.001) {
        items = [["株式会社ゼ〇ショーホールディングス", 1500000000000]];
    } else {
        items = Object.entries(menu).filter(([name]) => {
            return !isAllergyItem(name, allergies);
        });

        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
    }

    let total = 0;
    let result = [];
    
    const maxLimit = currentBudget + 7; 

    for (let [name, price] of items) {
        if (name === "株式会社ゼ〇ショーホールディングス") {
            result.push({name, price});
            total += price;
            continue;
        }

        if (total + price <= maxLimit) {
            result.push({name, price});
            total += price;
        }
    }

    result.sort((a, b) => a.price - b.price);

    setTimeout(() => showResult(result, total), 1000);
}

            else if (friedNames.includes(item.name)) {
                rarity = "★R";
                style = "color: #f5c300; font-weight: bold; text-shadow: 0 0 6px #ffe066;";
            }
            else if (ginzaraNames.includes(item.name)) {
                rarity = "★R";
                style = "color: silver; font-weight: bold; text-shadow: 0 0 6px #dcdcdc;";
            }
            else {
                rarity = "N";
                style = "color: #111; font-weight: normal;";
            }

            li.innerHTML = `
                <span class="name">${item.name}</span>
                <span class="price" style="${style}">
                    ${item.price.toLocaleString()}円 ${rarity}
                </span>
            `;

            if (isShine) li.classList.add("shine");

            document.getElementById("item").play();
            list.appendChild(li);

            i++;
            setTimeout(loop, 200);
        } else {
            const totalText = document.createElement("h3");
            totalText.style.textAlign = "right";
            totalText.style.borderTop = "2px solid #8b5a2b";
            totalText.style.paddingTop = "10px";
            totalText.style.marginTop = "10px";
            totalText.textContent = `合計：${total.toLocaleString()}円`;

            resultDiv.appendChild(totalText);

            if (hasSSR) {
                document.body.style.backgroundImage = "linear-gradient(45deg, orange, yellow )";
                const msg = document.createElement("h2");
                msg.textContent = "🎉 SSSR獲得！";
                msg.style.color = "gold";
                resultDiv.appendChild(msg);
            } else {
                document.body.style.backgroundImage = woodBg;
                document.body.style.backgroundColor = woodColor;
            }
            isRolling = false;
        }
    }
    loop();
}
</script>

</body>
</html>
